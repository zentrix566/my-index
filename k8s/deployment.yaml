apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentrix-lab
  namespace: default
  labels:
    app: zentrix
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: zentrix
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 发布期间旧 Pod 必须保持可用，新 Pod Ready 后才允许退出。
      maxUnavailable: 0
      # 常态仍为单副本，发布时最多临时增加一个 Pod。
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zentrix
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: lab-container
          image: crpi-nfo20s3jyve6dt2s.cn-beijing.personal.cr.aliyuncs.com/zentrix-repo/devops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "80"
            # 启动自动种子（所有者账号 + 示例进度），设为 "false" 可关闭
            - name: SEED_ON_STARTUP
              value: "true"
            - name: OWNER_USERNAME
              value: "zentrix566"
            # 敏感信息来自 Secret（见 secret.yaml）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: jwt-secret
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: owner-password
            # ========== PostgreSQL 连接（数据层已从 SQLite 迁移到 PG）==========
            # 非敏感参数明文注入；密码来自 Secret（见 secret.yaml 的 pg-pass）
            - name: PG_HOST
              value: "39.106.136.18"
            - name: PG_USER
              value: "postgres"
            - name: PG_DATABASE
              value: "zentrix"
            - name: PG_PORT
              value: "5432"
            # PG 跑在 docker 内，通常未开启 SSL，设为 "false"；若你的 PG 强制 SSL 改为 "require"
            - name: PG_SSL
              value: "false"
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: pg-pass
            # ========== 统一认证库（用户/令牌/模块统计）独立连接 ==========
            # 账号体系与业务数据物理隔离；生产缺失时服务拒绝启动，不再回退主库。
            # 连接串含密码，故放在 Secret（见 secret.yaml 的 auth-db-url）。
            - name: AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: auth-db-url
            - name: AUTH_DB_NAME
              value: "zentrix_auth"
            # ========== 「抵御域外心魔」独立数据层 ==========
            # 复用同一套 PG 凭据，但连独立的库 zentrix_willpower（与炉石库隔离）。
            - name: WILLPOWER_PG_HOST
              value: "39.106.136.18"
            - name: WILLPOWER_PG_USER
              value: "postgres"
            - name: WILLPOWER_PG_DATABASE
              value: "zentrix_willpower"
            - name: WILLPOWER_PG_PORT
              value: "5432"
            - name: WILLPOWER_PG_SSL
              value: "false"
            - name: WILLPOWER_PG_PASS
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: pg-pass
            # ========== 灵感备忘独立数据层 ==========
            # 复用同一套 PG 凭据，记录落在独立的 zentrix_notes 库。
            - name: NOTES_PG_DATABASE
              value: "zentrix_notes"
            # 灵感备忘图片：写入 OSS 的 notes-images/年份/YYYY-MM/ 目录，图片读取仍经过登录鉴权接口。
            - name: NOTES_OSS_BUCKET
              value: "zentrix-notes-images"
            - name: NOTES_OSS_REGION
              value: "cn-beijing"
            - name: NOTES_OSS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: notes-oss-access-key-id
            - name: NOTES_OSS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: notes-oss-access-key-secret
            - name: WILLPOWER_HOLD_SECONDS
              value: "600"
            - name: WILLPOWER_TIME_ZONE
              value: "Asia/Shanghai"
            # AI 建议（实验功能）：DeepSeek Key 仅服务端使用，前端不接触
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zentrix-secrets
                  key: deepseek-api-key
            # 每日额度（可选，缺省 5 次固定 + 1 次自由）
            - name: AI_FIXED_DAILY
              value: "5"
            - name: AI_FREE_DAILY
              value: "1"
            # 邮箱激活与密码重置链接必须指向正式站点。
            - name: APP_URL
              value: "https://zentrix566.top"
            # QQ 邮箱 SMTP：账号、授权码和发件地址由独立 Secret 注入。
            - name: SMTP_HOST
              value: "smtp.qq.com"
            - name: SMTP_PORT
              value: "465"
            - name: SMTP_SECURE
              value: "true"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: zentrix-mail-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: zentrix-mail-secrets
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: zentrix-mail-secrets
                  key: SMTP_FROM
          resources: {}
          # 数据层已迁移到 PostgreSQL（外部托管），不再有单文件数据库共享限制。
          # 常态保持 replicas:1；滚动发布时两个 Pod 会短暂重叠。
          lifecycle:
            preStop:
              exec:
                # 给 Service/Ingress 留出摘除旧 Endpoint 的传播时间。
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - mountPath: /app/logs
              name: access-logs
      imagePullSecrets:
        - name: aliyun-registry-secret
      volumes:
        - name: access-logs
          hostPath:
            path: /data/zentrix/logs
            type: DirectoryOrCreate
