# 敏感信息 Secret 模板
# ⚠️ 部署前请替换为真实值，或用命令生成：
#   kubectl create secret generic zentrix-secrets \
#     --namespace default \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=owner-password="你的强密码" \
#     --from-literal=pg-pass="你的PostgreSQL密码" \
#     --from-literal=deepseek-api-key="sk-你的DeepSeek密钥"
#
# 注意：本文件提交到仓库时仅含占位符，切勿写入真实密钥。
# pg-pass 对应 deployment.yaml 里的 PG_PASS（PostgreSQL 连接密码）。
# deepseek-api-key 对应 deployment.yaml 里的 DEEPSEEK_API_KEY（AI 建议实验功能）。
# 邮箱账号与 QQ 邮箱授权码单独存放在 zentrix-mail-secrets，不写入本模板。
apiVersion: v1
kind: Secret
metadata:
  name: zentrix-secrets
  namespace: default
type: Opaque
stringData:
  # JWT 签名密钥：请用 `openssl rand -base64 48` 生成，长度越长越安全
  jwt-secret: "CHANGE_ME_USE_OPENSSL_RAND_BASE64_48"
  # 所有者账号初始密码（首次登录后请立即在应用内修改，或改由 Secret 注入）
  owner-password: "change-password"
  # PostgreSQL 连接密码（deployment.yaml 的 PG_PASS 引用此 key）
  pg-pass: "CHANGE_ME_PG_PASSWORD"
  # 统一认证库连接串：账号体系独立库 zentrix_auth（与 PG_PASS 同密码）。
  # deployment.yaml 的 AUTH_DB_URL 引用此 key。生产部署时替换为真实密码。
  auth-db-url: "postgres://postgres:CHANGE_ME_PG_PASSWORD@39.106.136.18:5432/zentrix_auth"
  # DeepSeek API Key（deployment.yaml 的 DEEPSEEK_API_KEY 引用此 key；仅服务端使用）
  deepseek-api-key: "CHANGE_ME_DEEPSEEK_KEY"
